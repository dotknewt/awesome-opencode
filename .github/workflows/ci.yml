name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install required Linux lock implementation
        run: sudo apt-get update && sudo apt-get install --yes util-linux
      - name: Install exact dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Validate catalog
        run: npm run validate
      - name: Run manifest, installer, and CLI tests
        run: npm run test:installer
      - name: Run real package lifecycle tests
        run: npm run test:package

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install qemu-img for temporary-file integration tests
        run: sudo apt-get update && sudo apt-get install --yes qemu-utils
      - name: Run complete fake-adapter and temporary qemu-img suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --isolated --python 3.13 --with 'mcp==2.2.0'
          python -m unittest discover
          -s toolkits/libvirt-toolkit/mcp/libvirt/tests -p 'test_*.py' -v

  opencode-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install required Linux lock implementation
        run: sudo apt-get update && sudo apt-get install --yes util-linux
      - run: npm ci
      - name: Validate generated native MCP entry against public schema
        run: npm run test:opencode:schema

  opencode-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install required Linux lock implementation
        run: sudo apt-get update && sudo apt-get install --yes util-linux
      - run: npm ci
      - name: Install measured OpenCode CLI
        run: npm install --global opencode-ai@1.18.31
      - name: Prove actual isolated native discovery with MCP disabled
        run: npm run test:opencode:discovery
